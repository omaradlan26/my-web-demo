<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Sign In</h2>
    <div id="message-area" role="alert"></div>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Sign In</button>
    </form>
    <p style="margin-top:12px">Don't have an account? <a href="index.html">Register on main page</a></p>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const msg = document.getElementById('message-area');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display='none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/login', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({username,password}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        if (data.user.role === 'admin') location.href = 'admin.html';
        else location.href = 'user.html';
      } catch (err) {
        msg.textContent = err.message; msg.className='message-error'; msg.style.display='block';
      }
    });
  </script>
</body>
</html>
