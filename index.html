<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="header-left">
                <h1>Library Management System</h1>
                <p class="muted">Phase 1</p>
            </div>
            <div class="header-right">
                <input id="search-input" type="text" placeholder="Search title or author..." aria-label="Search books">
                <button id="clear-storage">Clear Local Data</button>
                <button id="theme-toggle">Toggle Theme</button>
                <div id="clock" aria-live="polite"></div>
            </div>
        </header>

        <div id="message-area" role="alert"></div>
        <div class="content">
            <section id="get-started">
                <h2>Get Started</h2>
                <p>Register to create a user account, or <a href="login.html">sign in</a> if you already have one.</p>
                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit">Create Account</button>
                </form>
                <p style="font-size: 0.9em; color: #666; margin-top: 12px;">Or <a href="login.html">Sign in</a> — admin user: <strong>admin / admin123</strong></p>
            </section>

            <section id="book-list-section">
                <h2>Library Stock</h2>
                <table id="book-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="book-list-body">
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <script>
    // registration logic (uses backend if available)
    const regForm = document.getElementById('register-form');
    const msg = document.getElementById('message-area');
    if (regForm) regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.style.display='none';
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;
        try {
            const res = await fetch('/api/auth/register', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({username,password}) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Registration failed');
            msg.textContent = 'Account created. Please sign in.'; msg.className='message-success'; msg.style.display='block';
        } catch (err) {
            msg.textContent = err.message; msg.className='message-error'; msg.style.display='block';
        }
    });
    </script>
    <script src="script.js"></script>
</body>
</html>
