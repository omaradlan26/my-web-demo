<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="header-left">
                <h1>Library Management System</h1>
                <p class="muted">Phase 1</p>
            </div>
            <div class="header-right">
                <input id="search-input" type="text" placeholder="Search title or author..." aria-label="Search books">
                <button id="clear-storage">Clear Local Data</button>
                <button id="theme-toggle">Toggle Theme</button>
                <div id="clock" aria-live="polite"></div>
            </div>
        </header>

        <div id="message-area" role="alert"></div>
        <div class="content">
            
            <section id="add-book-section">
                <h2>Add New Book</h2>
                <form id="add-book-form">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" required>
                    </div>
                    <button type="submit">Add Book to Catalog</button>
                </form>
                <p style="font-size: 0.8em; color: #666; margin-top: 20px;">
                    *Data is saved locally in your browser (Local Storage).
                </p>
            </section>

            <section id="book-list-section">
                <h2>Library Stock</h2>
                <table id="book-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="book-list-body">
                        </tbody>
                </table>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
